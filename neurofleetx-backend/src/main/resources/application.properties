spring.application.name=${SPRING_APPLICATION_NAME:NeuroFleetX}

# ======================================================
# DATABASE CONFIG  — MySQL
# ======================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/neurofleetx?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ======================================================
# JPA / HIBERNATE  — MySQL 8 Dialect
# ======================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ======================================================
# SERVER
# ======================================================
server.port=${SERVER_PORT:8080}

# ======================================================
# JWT
# ======================================================
jwt.secret=${JWT_SECRET:ThisIsA256BitSecretKeyForNeuroFleetXChangeThisInProduction!!}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# ======================================================
# MACHINE LEARNING SERVICE
# ======================================================
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}
ml.service.connect-timeout=${ML_SERVICE_CONNECT_TIMEOUT:5000}
ml.service.read-timeout=${ML_SERVICE_READ_TIMEOUT:10000}

# ======================================================
# SMTP EMAIL
# ======================================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:your-email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}

# ======================================================
# APPLICATION SETTINGS
# ======================================================
app.name=${APP_NAME:NeuroFleetX}
app.url=${APP_URL:http://localhost:5173}
app.support.email=${APP_SUPPORT_EMAIL:support@neurofleetx.com}
app.noreply.email=${APP_NOREPLY_EMAIL:noreply@neurofleetx.com}

# ======================================================
# PASSWORD RESET
# ======================================================
password.reset.token.expiry=${PASSWORD_RESET_TOKEN_EXPIRY:3600000}

# ======================================================
# BOOKING CONFIG
# ======================================================
booking.default-price-per-hour=${BOOKING_DEFAULT_PRICE_PER_HOUR:500}
booking.ev-surcharge=${BOOKING_EV_SURCHARGE:50}
booking.time-slot-duration-minutes=${BOOKING_TIME_SLOT_DURATION:60}

# ======================================================
# RAZORPAY
# ======================================================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_REPLACE_ME}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:REPLACE_ME}

# ======================================================
# MAINTENANCE CONFIG
# ======================================================
maintenance.check-interval-days=${MAINTENANCE_CHECK_INTERVAL_DAYS:30}
maintenance.critical-threshold=${MAINTENANCE_CRITICAL_THRESHOLD:7}
maintenance.due-threshold=${MAINTENANCE_DUE_THRESHOLD:14}

# ======================================================
# LOGGING
# ======================================================
logging.level.com.infosys.service=INFO
logging.level.com.infosys.controller=INFO
logging.level.com.infosys.repository=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
